name: Release

on:
  push:
    tags: [v*]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: linux-x64
            install_deps: |
              sudo apt-get update -q
              sudo apt-get install -y -q libsdl2-dev
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DENABLE_SDL=ON
            package: cd install && zip -r ../videopac-linux-x64.zip .

          - os: macos-13
            arch: macos-x64
            install_deps: brew install sdl2
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DENABLE_SDL=ON
            package: cd install && zip -r ../videopac-macos-x64.zip .

          - os: windows-2022
            arch: win-x64
            install_deps: vcpkg install sdl2:x64-windows
            cmake_args: >-
              -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
              -DENABLE_SDL=ON
            package: Compress-Archive -Path install/* -Destination videopac-win-x64.zip

    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error -C Release -j 2

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videopac-${{ matrix.arch }}
          path: videopac-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'qam4'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: videopac ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: artifacts/*.zip
